# Runs the contact API's tests (server/) whenever it changes.
name: API tests

on:
  push:
    paths: ['server/**', '.github/workflows/api-tests.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/api-tests.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
