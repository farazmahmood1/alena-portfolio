# Uploads the site to Hostinger (public_html) over FTP on every push to main.
# Only files that changed since the last deploy are sent; the action keeps a
# small state file (.ftp-deploy-sync-state.json) on the server to track that.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    e.g. ftp.codilated.com (or the FTP IP shown in hPanel)
#   FTP_USERNAME  an FTP account whose directory is public_html
#   FTP_PASSWORD  that account's password
#
# Optional repository variables (Settings → Secrets and variables → Actions → Variables),
# baked into assets/site-config.js before upload:
#   VITE_GA_MEASUREMENT_ID  GA4 ID (G-XXXXXXX); unset = no analytics
#   API_BASE                public origin of the contact API (see server/README.md)
#
# The contact API in server/ is not uploaded here — FTP hosting can't run Node.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so sitemap <lastmod> dates come from real commits

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write front-end config (analytics ID, API origin)
        env:
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          API_BASE: ${{ vars.API_BASE }}
        run: node scripts/write-site-config.mjs

      - name: Generate sitemap.xml
        run: node scripts/generate-sitemap.mjs

      - name: Upload changed files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Encrypted FTP. Hostinger's certificate is issued for its own server
          # name rather than codilated.com, so skip the hostname check.
          protocol: ftps
          security: loose
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            server/**
            scripts/**
            **/*.md
            .env.example
            vercel.json
            netlify.toml
