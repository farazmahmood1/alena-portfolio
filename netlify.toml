# Codilated — Netlify configuration
[build]
  publish = "."

# Serve pages without the .html extension and 301 the extension away.
[build.processing]
  skip_processing = false

[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true

[[headers]]
  for = "/wp-content/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
